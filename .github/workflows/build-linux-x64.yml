name: build-linux-x64

on:
  push:
    paths:
      - ".github/workflows/build-linux-x64.yml"
      - "build.gradle"
      - "gradle.properties"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - "src/**"
      - "shaders/**"
      - "native/**"
      - "scripts/test_denoise_regressions.py"
  pull_request:
    paths:
      - ".github/workflows/build-linux-x64.yml"
      - "build.gradle"
      - "gradle.properties"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - "src/**"
      - "shaders/**"
      - "native/**"
      - "scripts/test_denoise_regressions.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-linux-x64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build portable Linux x64 JAR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Caustica
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            glslang-tools spirv-tools \
            cmake ninja-build clang \
            libvulkan-dev

      - name: Build regular JAR
        run: bash ./gradlew --no-daemon build

      - name: Run renderer seam regressions
        run: python3 scripts/test_denoise_regressions.py

      - name: Inspect packaged native resources
        run: |
          set -euo pipefail
          jar_file="$(find build/libs -maxdepth 1 -type f -name 'caustica-*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' | head -1)"
          test -n "$jar_file"
          echo "JAR: $jar_file"
          # Required Linux natives — see NrdRuntime / ffx_* shims. Missing any one of these
          # on the launched JAR is the failure mode a player hits at first tryUse(): the
          # loader falls back to "RT disabled" instead of the renderer.
          expected=(
            caustica/natives/linux-x64/libnrd_caustica.so
            caustica/natives/linux-x64/libffx_denoiser_caustica.so
            caustica/natives/linux-x64/libffx_fsr2_caustica.so
            caustica/natives/linux-x64/libcaustica_native.so
          )
          missing=()
          for entry in "${expected[@]}"; do
            if ! unzip -l "$jar_file" "$entry" >/dev/null 2>&1; then
              missing+=("$entry")
            else
              echo "OK  $entry"
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "JAR missing required Linux natives:" >&2
            printf '  - %s\n' "${missing[@]}" >&2
            exit 1
          fi
          echo "All required Linux natives present."
          # Informational listing of all bundled natives.
          unzip -l "$jar_file" | awk '/caustica\/natives\// {print "  " $NF}'

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: caustica-linux-x64-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error

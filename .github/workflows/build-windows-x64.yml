name: build-windows-x64

on:
  push:
    paths:
      - ".github/workflows/build-windows-x64.yml"
      - ".github/workflows/build-linux-x64.yml"
      - "build.gradle"
      - "gradle.properties"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "src/**"
      - "shaders/**"
      - "native/**"
      - "scripts/**"
  pull_request:
    paths:
      - ".github/workflows/build-windows-x64.yml"
      - ".github/workflows/build-linux-x64.yml"
      - "build.gradle"
      - "gradle.properties"
      - "settings.gradle"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "src/**"
      - "shaders/**"
      - "native/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-windows-x64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"

jobs:
  build:
    name: Build portable Windows x64 JAR
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout Caustica
        uses: actions/checkout@v4

      # Visual Studio toolchain — required by the optional `buildNative` JNI scaffold task
      # (which on Windows produces libcaustica_native.dll) and by anyone re-running
      # build_nrd_windows.ps1 locally in the same workflow. We don't need cl.exe for the
      # regular JAR build since the pre-committed Windows DLLs are picked up straight from
      # src/main/resources/caustica/natives/windows-x64/, but having MSVC on the PATH means
      # a developer can iterate against the same toolchain as their local box.
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Install a minimal Vulkan SDK on Windows so :compileShaders can call
      # glslangValidator + spirv-val. The Linux side pulls a SDK tarball from LunarG; on
      # Windows the only reliable source of those binaries is the SDK installer — but
      # pulling the 162MB installer and running /S silently has proven to be flaky and
      # slow in the CI env. Faster path: clone the upstream repos and cmake-build just
      # the executables we need (`glslangValidator`, `spirv-val`). Both are small and
      # build in well under a minute on the windows-2022 runner.
      - name: Install minimal Vulkan SDK (glslangValidator + spirv-val from source)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $buildRoot = Join-Path $env:RUNNER_TEMP 'caustica-shader-tools'
          if (Test-Path $buildRoot) { Remove-Item -Recurse -Force $buildRoot }
          New-Item -ItemType Directory -Path $buildRoot | Out-Null

          Write-Host "Cloning glslang @ vulkan-sdk-1.3.290.0 (pinned)..."
          git clone --depth 1 --branch vulkan-sdk-1.3.290.0 https://github.com/KhronosGroup/glslang.git (Join-Path $buildRoot 'glslang') 2>&1 | Select-Object -Last 3
          Write-Host "Cloning SPIRV-Tools @ v2025.5 ..."
          git clone --depth 1 --branch v2025.5 https://github.com/KhronosGroup/SPIRV-Tools.git (Join-Path $buildRoot 'SPIRV-Tools') 2>&1 | Select-Object -Last 3
          Write-Host "Cloning SPIRV-Headers (dep)..."
          git clone --depth 1 --branch vulkan-sdk-1.3.290.0 https://github.com/KhronosGroup/SPIRV-Headers.git (Join-Path $buildRoot 'glslang\External\spirv-tools') 2>&1 | Select-Object -Last 3

          Write-Host "Configuring SPIRV-Tools ..."
          $spirvBuild = Join-Path $buildRoot 'SPIRV-Tools-build'
          cmake -S (Join-Path $buildRoot 'SPIRV-Tools') -B $spirvBuild -G Ninja `
                -DCMAKE_BUILD_TYPE=Release -DSPIRV_WERROR=OFF -DSPIRV_SKIP_TESTS=ON 2>&1 | Select-Object -Last 5
          Write-Host "Building SPIRV-Tools (spirv-val only) ..."
          cmake --build $spirvBuild --target spirv-val --config Release 2>&1 | Select-Object -Last 5

          Write-Host "Configuring glslang (bundled SPIRV-Tools via External/spirv-tools) ..."
          $glslangBuild = Join-Path $buildRoot 'glslang-build'
          cmake -S (Join-Path $buildRoot 'glslang') -B $glslangBuild -G Ninja `
                -DCMAKE_BUILD_TYPE=Release -DGLSLANG_TESTS=OFF -DENABLE_OPT=OFF -DENABLE_HLSL=OFF `
                -DENABLE_GLSLANG_BINARIES=ON 2>&1 | Select-Object -Last 5
          Write-Host "Building glslang standalone ..."
          cmake --build $glslangBuild --target glslang --config Release 2>&1 | Select-Object -Last 5
          Write-Host "Listing glslang targets ..."
          cmake --build $glslangBuild --target help 2>&1 | Select-String 'glslang' | Select-Object -First 5

          $vulkanBin = Join-Path $env:VULKAN_SDK 'Bin'
          if (-not (Test-Path $vulkanBin)) { New-Item -ItemType Directory -Path $vulkanBin | Out-Null }
          Copy-Item (Join-Path $spirvBuild 'tools\spirv-val.exe')         (Join-Path $vulkanBin 'spirv-val.exe')         -Force
          Copy-Item (Join-Path $glslangBuild 'StandAlone\glslangValidator.exe') (Join-Path $vulkanBin 'glslangValidator.exe') -Force
          Copy-Item (Join-Path $glslangBuild 'StandAlone\glslang.exe')          (Join-Path $vulkanBin 'glslang.exe')          -Force

          foreach ($exe in 'glslangValidator.exe','spirv-val.exe') {
              $path = Join-Path $vulkanBin $exe
              if (-not (Test-Path $path)) { throw "$exe missing at $path after build" }
              & $path --version | Select-Object -First 1 | Write-Host
          }

          "VULKAN_SDK=$vulkanBin" | Out-File -FilePath $env:GITHUB_ENV -Append
          "$vulkanBin" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Mirror the user's local command:
      #   ./gradlew.bat build
      # `set -uo pipefail` (no -e) reads the exit code from ${PIPESTATUS[0]} so tee can't
      # swallow a failing build.
      - name: Build jar
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $cmd = if (Test-Path 'gradlew.bat') { '.\gradlew.bat' } else { 'gradle' }
          & $cmd --no-daemon build 2>&1 | Tee-Object -FilePath build.log
          $rc = $LASTEXITCODE
          Write-Host "build rc=$rc"
          if ($rc -ne 0) {
              $summary = @(
                  "## build failed (rc=$rc) on ${{ runner.os }}",
                  "",
                  "<details><summary>Gradle output (click to expand)</summary>",
                  "",
                  "``````",
                  (Select-String -Path build.log -Pattern 'error: |FAILURE|\* What went wrong|\* Where:|\* Try:' -SimpleMatch:$false | Select-Object -First 200) -join "`n",
                  "``````",
                  "",
                  "</details>",
                  "",
                  "Full log uploaded as `build-windows-build-log` artifact."
              ) -join "`n"
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
              exit $rc
          }

      - name: Upload build log (on failure only)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-windows-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Inspect packaged native resources
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $jarFile = Get-ChildItem -Path build/libs -Filter 'caustica-*.jar' |
              Where-Object { $_.Name -notmatch '-sources\.jar$' -and $_.Name -notmatch '-dev\.jar$' } |
              Select-Object -First 1
          if (-not $jarFile) { throw "no caustica-*.jar produced under build/libs" }
          Write-Host "JAR: $($jarFile.FullName) ($($jarFile.Length) bytes)"

          # Required Windows natives — see NrdRuntime / ffx_* shims. Missing any one of these
          # on the launched JAR is the failure mode a player hits at first tryUse(): the
          # loader falls back to "RT disabled" instead of the renderer.
          $expected = @(
              'caustica/natives/windows-x64/nrd_caustica.dll',
              'caustica/natives/windows-x64/ffx_denoiser_caustica.dll',
              'caustica/natives/windows-x64/ffx_fsr2_caustica.dll'
          )

          # List every entry in the JAR via .NET ZipFile (no external `7z`/`unzip` needed).
          Add-Type -AssemblyName System.IO.Compression.FileSystem | Out-Null
          $zip = [System.IO.Compression.ZipFile]::OpenRead($jarFile.FullName)
          try {
              $entries = New-Object 'System.Collections.Generic.HashSet[string]'
              foreach ($entry in $zip.Entries) { [void]$entries.Add($entry.FullName) }
          } finally {
              $zip.Dispose()
          }

          $missing = New-Object 'System.Collections.Generic.List[string]'
          foreach ($e in $expected) {
              if ($entries.Contains($e)) { Write-Host "OK  $e" }
              else { [void]$missing.Add($e) }
          }
          if ($missing.Count -gt 0) {
              Write-Error "JAR missing required Windows natives:`n  $($missing -join "`n  ")"
              exit 1
          }
          Write-Host "All required Windows natives present in $($jarFile.Name)."

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: caustica-windows-x64-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error

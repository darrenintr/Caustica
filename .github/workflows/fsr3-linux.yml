name: FSR3 Integration - Linux

on:
  push:
    paths:
      - 'native/fsr3_wine_bridge/**'
      - '.github/workflows/fsr3-linux.yml'
  pull_request:
    paths:
      - 'native/fsr3_wine_bridge/**'

jobs:
  build-linux:
    name: Build FSR3 Wine Bridge (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mingw-w64 \
            wine64 \
            libvulkan-dev \
            vulkan-headers

      - name: Build Wine Bridge
        working-directory: native/fsr3_wine_bridge
        run: |
          chmod +x build.sh
          bash build.sh

      - name: Verify build outputs
        working-directory: native/fsr3_wine_bridge/build_wine
        run: |
          echo "Checking build outputs..."
          ls -lh

          if [ ! -f fsr3_server.exe ]; then
            echo "Error: fsr3_server.exe not found"
            exit 1
          fi

          if [ ! -f fsr3_server_stub.exe ]; then
            echo "Error: fsr3_server_stub.exe not found"
            exit 1
          fi

          if [ ! -f libfsr3_wine_client.so ]; then
            echo "Error: libfsr3_wine_client.so not found"
            exit 1
          fi

          echo "✓ All build outputs present"
          file fsr3_server.exe
          file libfsr3_wine_client.so

      - name: Run integration test (stub mode)
        working-directory: native/fsr3_wine_bridge
        run: |
          echo "Starting stub server test..."

          # Start stub server in background
          timeout 10 wine build_wine/fsr3_server_stub.exe > /tmp/server.log 2>&1 &
          SERVER_PID=$!

          echo "Waiting for server to start (PID: $SERVER_PID)..."
          sleep 8

          # Check if server is running
          echo "Checking server log..."
          cat /tmp/server.log

          if grep -q "Server ready" /tmp/server.log; then
            echo "✓ Stub server started successfully"
          else
            echo "⚠ Server may not have started properly, but continuing"
          fi

          # Cleanup
          kill $SERVER_PID 2>/dev/null || true
          killall wine 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fsr3-linux-bridge
          path: |
            native/fsr3_wine_bridge/build_wine/fsr3_server.exe
            native/fsr3_wine_bridge/build_wine/fsr3_server_stub.exe
            native/fsr3_wine_bridge/build_wine/libfsr3_wine_client.so
          retention-days: 7

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fsr3-linux-logs
          path: /tmp/server.log
          retention-days: 3

name: FSR3 Integration - Linux (Simplified)

on:
  push:
    paths:
      - 'native/fsr3_wine_bridge/**'
      - '.github/workflows/fsr3-linux.yml'
  pull_request:
    paths:
      - 'native/fsr3_wine_bridge/**'

jobs:
  build-linux:
    name: Build FSR3 Wine Bridge (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            mingw-w64 \
            g++ \
            libvulkan-dev

      - name: Make scripts executable
        working-directory: native/fsr3_wine_bridge
        run: |
          chmod +x build.sh
          ls -la build.sh

      - name: Build Wine Bridge
        working-directory: native/fsr3_wine_bridge
        run: |
          echo "Starting build..."
          bash -x build.sh
          echo "Build complete"

      - name: List build directory
        working-directory: native/fsr3_wine_bridge
        run: |
          echo "Build directory contents:"
          ls -lah build_wine/ || echo "build_wine directory not found"

      - name: Verify build outputs
        working-directory: native/fsr3_wine_bridge
        run: |
          echo "Checking for output files..."

          if [ -f build_wine/fsr3_server.exe ]; then
            echo "✓ fsr3_server.exe found ($(stat -f%z build_wine/fsr3_server.exe 2>/dev/null || stat -c%s build_wine/fsr3_server.exe) bytes)"
          else
            echo "✗ fsr3_server.exe NOT found"
            exit 1
          fi

          if [ -f build_wine/fsr3_server_stub.exe ]; then
            echo "✓ fsr3_server_stub.exe found ($(stat -f%z build_wine/fsr3_server_stub.exe 2>/dev/null || stat -c%s build_wine/fsr3_server_stub.exe) bytes)"
          else
            echo "✗ fsr3_server_stub.exe NOT found"
            exit 1
          fi

          if [ -f build_wine/libfsr3_wine_client.so ]; then
            echo "✓ libfsr3_wine_client.so found ($(stat -f%z build_wine/libfsr3_wine_client.so 2>/dev/null || stat -c%s build_wine/libfsr3_wine_client.so) bytes)"
          else
            echo "✗ libfsr3_wine_client.so NOT found"
            exit 1
          fi

          echo ""
          echo "All build artifacts present!"
          file build_wine/fsr3_server.exe
          file build_wine/libfsr3_wine_client.so

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fsr3-linux-bridge
          path: |
            native/fsr3_wine_bridge/build_wine/fsr3_server.exe
            native/fsr3_wine_bridge/build_wine/fsr3_server_stub.exe
            native/fsr3_wine_bridge/build_wine/libfsr3_wine_client.so
          retention-days: 7

      - name: Create build summary
        if: success()
        run: |
          echo "## FSR3 Linux Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Build completed successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- fsr3_server.exe (Wine server - full)" >> $GITHUB_STEP_SUMMARY
          echo "- fsr3_server_stub.exe (Wine server - stub)" >> $GITHUB_STEP_SUMMARY
          echo "- libfsr3_wine_client.so (Linux client)" >> $GITHUB_STEP_SUMMARY

name: CI

on:
  push:
    paths:
      - ".github/workflows/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "native/**"
      - "shaders/**"
      - "src/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "native/**"
      - "shaders/**"
      - "src/**"
  # Manual trigger: maintainers can run a full bundle with private SDK binaries uploaded as
  # artifacts. See the "Bundle full release" job below — it only runs on workflow_dispatch
  # with the `bundle-full` input flag, and the FFX_SDK / XESS_SDK paths are passed in via the
  # environment. Use this for cutting release tags when the upstream SDK binaries are
  # available locally.
  workflow_dispatch:
    inputs:
      bundle_full:
        description: "Bundle FSR + XeSS native libraries (requires FFX_SDK + XESS_SDK env)"
        type: boolean
        default: false

env:
  # Public SDK refs
  DLSS_SDK_REF: v310.7.0
  DLSS_SDK_PATH: third_party/DLSS
  FFX_SDK_REF: fsr3-v3.0.4
  FFX_SDK_PATH: third_party/FidelityFX-SDK
  XESS_SDK_REF: v3.0.1
  XESS_SDK_PATH: third_party/xess

  # NGX shim build config
  NGX_SHIM_CONFIG: release
  NGX_VENDOR_CONFIG: rel

  # Vulkan SDK (CI only)
  VULKAN_SDK_VERSION: 1.4.350.0
  VULKAN_SDK_SHA256: b65f068ab36263559da49d7cacd7e7b9df23824ca8b68ccc522a2b06f5725df2

jobs:
  native-windows:
    name: Build Windows NGX shim
    runs-on: windows-2022

    steps:
      - name: Checkout Caustica
        uses: actions/checkout@v4

      - name: Checkout DLSS SDK
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/DLSS
          ref: ${{ env.DLSS_SDK_REF }}
          path: ${{ env.DLSS_SDK_PATH }}

      - name: Checkout AMD FidelityFX SDK (source only)
        uses: actions/checkout@v4
        with:
          repository: GPUOpen-LibrariesAndSDKs/FidelityFX-SDK
          ref: ${{ env.FFX_SDK_REF }}
          path: ${{ env.FFX_SDK_PATH }}

      - name: Checkout Intel XeSS SDK (Windows binaries)
        uses: actions/checkout@v4
        with:
          repository: intel/xess
          ref: ${{ env.XESS_SDK_REF }}
          path: ${{ env.XESS_SDK_PATH }}

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: ${{ env.VULKAN_SDK_VERSION }}
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Configure NGX shim
        shell: pwsh
        env:
          DLSS_SDK: ${{ github.workspace }}/${{ env.DLSS_SDK_PATH }}
        run: >
          cmake -S native/ngx_shim
          -B build/cmake/ngx_shim
          -G "Visual Studio 17 2022"
          -A x64

      - name: Build NGX shim
        shell: pwsh
        run: cmake --build build/cmake/ngx_shim --config Release

      - name: Upload Windows NGX shim
        uses: actions/upload-artifact@v4
        with:
          name: ngxshim-windows-x64
          path: build/native/ngx_shim/release/ngxshim.dll
          if-no-files-found: error

  native-linux:
    name: Build Linux NGX shim
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Caustica
        uses: actions/checkout@v4

      - name: Checkout DLSS SDK
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/DLSS
          ref: ${{ env.DLSS_SDK_REF }}
          path: ${{ env.DLSS_SDK_PATH }}

      - name: Checkout AMD FidelityFX SDK (source only)
        uses: actions/checkout@v4
        with:
          repository: GPUOpen-LibrariesAndSDKs/FidelityFX-SDK
          ref: ${{ env.FFX_SDK_REF }}
          path: ${{ env.FFX_SDK_PATH }}

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build glslang-tools spirv-tools libvulkan-dev

      - name: Configure NGX shim
        env:
          DLSS_SDK: ${{ github.workspace }}/${{ env.DLSS_SDK_PATH }}
          VULKAN_SDK: /usr
        run: >
          cmake -S native/ngx_shim
          -B build/cmake/ngx_shim
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      - name: Build NGX shim
        run: cmake --build build/cmake/ngx_shim --config Release

      - name: Upload Linux NGX shim
        uses: actions/upload-artifact@v4
        with:
          name: ngxshim-linux-x64
          path: build/native/ngx_shim/release/libngxshim.so
          if-no-files-found: error

  package:
    name: Build bundled mod jar
    runs-on: ubuntu-latest
    needs:
      - native-windows
      - native-linux

    steps:
      - name: Checkout Caustica
        uses: actions/checkout@v4

      - name: Checkout DLSS SDK
        uses: actions/checkout@v4
        with:
          repository: NVIDIA/DLSS
          ref: ${{ env.DLSS_SDK_REF }}
          path: ${{ env.DLSS_SDK_PATH }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Vulkan SDK shader tools
        run: |
          archive="vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz"
          url="https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/${archive}"
          sdk_root="${RUNNER_TEMP}/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64"

          curl --fail --location --retry 3 --retry-delay 5 --output "${archive}" "${url}"
          echo "${VULKAN_SDK_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/vulkan-sdk"
          tar -xf "${archive}" -C "${RUNNER_TEMP}/vulkan-sdk"

          # Don't set VULKAN_SDK in GITHUB_ENV — build.gradle's resolveVulkanTool()
          # tries ${VULKAN_SDK}/Bin/ (capital B, Windows-only) which breaks on Linux.
          # Just add to PATH so resolveVulkanTool()'s fallback finds the tools.
          echo "${sdk_root}/bin" >> "${GITHUB_PATH}"
          "${sdk_root}/bin/glslangValidator" --version
          "${sdk_root}/bin/spirv-val" --version

      - name: Download NGX shims
        uses: actions/download-artifact@v4
        with:
          pattern: ngxshim-*
          path: build/native/ngx_shim/release
          merge-multiple: true

      # AMD FFX and Intel XeSS SDKs aren't bundled by default on CI — the public GitHub repos
      # only ship source / Windows binaries, and the runtime DLLs come from private downloads
      # (AMD GPUOpen download page, Intel Developer Zone). `bundleFsrNatives` and
      # `bundleXessNatives` graceful-skip when the SDK paths don't exist, so the build still
      # produces a working mod jar — the FSR / XeSS code paths just activate at runtime when
      # the user installs the SDKs and points caustica.fsr.path / caustica.xess.path at them.
      - name: Build bundled jar
        env:
          DLSS_SDK: ${{ github.workspace }}/${{ env.DLSS_SDK_PATH }}
        run: >
          bash ./gradlew build
          -PngxPlatforms=windows-x64,linux-x64
          -PngxVendorConfig=${{ env.NGX_VENDOR_CONFIG }}
          -PngxShimConfig=${{ env.NGX_SHIM_CONFIG }}

      - name: Upload bundled jar
        uses: actions/upload-artifact@v4
        with:
          name: caustica-bundled-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error

  # Full-bundle release job. Only runs when triggered manually with the `bundle_full` input.
  # Expects the FFX + XeSS SDK binaries to be present on the runner as environment paths
  # (passed in via a self-hosted runner with FFX_SDK + XESS_SDK exported, or via the actions
  # environment). This job produces a "fat" jar with all three native SDKs bundled.
  bundle-full:
    name: Build full-bundle release (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.bundle_full
    needs:
      - native-windows
      - native-linux
      - package

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Verify SDK env is set
        env:
          FFX_SDK: ${{ vars.FFX_SDK }}
          XESS_SDK: ${{ vars.XESS_SDK }}
        run: |
          if [ -z "${FFX_SDK}" ] || [ -z "${XESS_SDK}" ]; then
            echo "::error::FFX_SDK and XESS_SDK vars must be set on this workflow (or in the org's env settings) to run the full bundle."
            exit 1
          fi
          echo "FFX_SDK=${FFX_SDK}"
          echo "XESS_SDK=${XESS_SDK}"
          ls -la "${FFX_SDK}/bin" "${XESS_SDK}/bin"

      - name: Re-run gradle build with SDK envs
        env:
          FFX_SDK: ${{ vars.FFX_SDK }}
          XESS_SDK: ${{ vars.XESS_SDK }}
        run: >
          bash ./gradlew clean build
          -PngxPlatforms=windows-x64,linux-x64
          -PngxVendorConfig=${{ env.NGX_VENDOR_CONFIG }}
          -PngxShimConfig=${{ env.NGX_SHIM_CONFIG }}

      - name: Upload full-bundle jar
        uses: actions/upload-artifact@v4
        with:
          name: caustica-full-bundle-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error

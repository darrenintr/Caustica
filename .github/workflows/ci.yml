name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "25"

jobs:
  validate:
    name: Java, SPIR-V, regressions, and JAR
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Caustica
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Vulkan shader and native-build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            glslang-tools spirv-tools \
            cmake ninja-build clang \
            libvulkan-dev
          glslangValidator --version
          spirv-val --version

      - name: Build
        run: bash ./gradlew --no-daemon build

      - name: Run renderer seam regressions
        run: python3 scripts/test_denoise_regressions.py

      - name: Check patch whitespace
        run: git diff --check

      - name: Upload regular mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: caustica-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error

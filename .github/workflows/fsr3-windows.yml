name: FSR3 Integration - Windows (Simplified)

on:
  push:
    paths:
      - 'native/fsr3_wine_bridge/**'
      - '.github/workflows/fsr3-windows.yml'
  pull_request:
    paths:
      - 'native/fsr3_wine_bridge/**'

jobs:
  build-windows:
    name: Build FSR3 Windows Integration
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Verify MSVC
        shell: pwsh
        run: |
          Write-Host "Checking MSVC compiler..."
          cl.exe 2>&1 | Select-Object -First 3
          Write-Host "MSVC ready"

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          Write-Host "Installing Vulkan SDK via Chocolatey..."
          choco install vulkan-sdk -y --no-progress

          Write-Host "`nWaiting for installation to complete..."
          Start-Sleep -Seconds 15

      - name: Find and configure Vulkan SDK
        shell: pwsh
        run: |
          Write-Host "Searching for Vulkan SDK..."

          $vulkanPaths = @(
            "C:\VulkanSDK",
            "$env:HOMEDRIVE\VulkanSDK"
          )

          $foundPath = $null
          foreach ($basePath in $vulkanPaths) {
            if (Test-Path $basePath) {
              $sdkDir = Get-ChildItem $basePath -Directory | Select-Object -First 1
              if ($sdkDir) {
                $foundPath = $sdkDir.FullName
                break
              }
            }
          }

          if ($foundPath) {
            Write-Host "✓ Found Vulkan SDK at: $foundPath"
            echo "VULKAN_SDK=$foundPath" >> $env:GITHUB_ENV

            # Verify critical files
            $headerPath = Join-Path $foundPath "Include\vulkan\vulkan.h"
            $libPath = Join-Path $foundPath "Lib\vulkan-1.lib"

            if (Test-Path $headerPath) {
              Write-Host "✓ Vulkan headers found"
            } else {
              Write-Error "Headers not found at: $headerPath"
              exit 1
            }

            if (Test-Path $libPath) {
              Write-Host "✓ Vulkan library found"
            } else {
              Write-Error "Library not found at: $libPath"
              exit 1
            }
          } else {
            Write-Error "Vulkan SDK not found in common locations"
            Write-Host "Searched paths:"
            $vulkanPaths | ForEach-Object { Write-Host "  - $_" }
            exit 1
          }

      - name: Build FSR3 Windows integration
        working-directory: native/fsr3_wine_bridge
        shell: pwsh
        run: |
          Write-Host "=== Building FSR3 Windows Integration ==="
          Write-Host "VULKAN_SDK = $env:VULKAN_SDK"

          # Create build directory
          New-Item -ItemType Directory -Force -Path build_windows | Out-Null

          # Compile
          $includeFlags = @(
            "/I$env:VULKAN_SDK\Include",
            "/I."
          )

          $compileFlags = @(
            "/nologo",
            "/O2",
            "/MD",
            "/EHsc",
            "/std:c++17",
            "/LD",
            "/DWIN32",
            "/D_WINDOWS",
            "/DUNICODE",
            "/D_UNICODE"
          )

          $linkLibs = @(
            "d3d12.lib",
            "dxgi.lib",
            "uuid.lib",
            "vulkan-1.lib"
          )

          $linkFlags = @(
            "/link",
            "/DLL",
            "/LIBPATH:$env:VULKAN_SDK\Lib"
          )

          Write-Host "`nCompiling fsr3_windows.cpp..."

          & cl.exe @compileFlags @includeFlags `
            fsr3_windows.cpp `
            /Fe:build_windows\fsr3_windows.dll `
            @linkFlags @linkLibs

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Compilation failed with exit code $LASTEXITCODE"
            exit 1
          }

          Write-Host "`n✓ Build completed successfully"

      - name: Verify build output
        working-directory: native/fsr3_wine_bridge/build_windows
        shell: pwsh
        run: |
          Write-Host "Checking build outputs..."

          if (Test-Path "fsr3_windows.dll") {
            $dll = Get-Item "fsr3_windows.dll"
            Write-Host "✓ fsr3_windows.dll"
            Write-Host "  Size: $($dll.Length) bytes"
            Write-Host "  Modified: $($dll.LastWriteTime)"
          } else {
            Write-Error "fsr3_windows.dll not found!"
            Write-Host "`nDirectory contents:"
            Get-ChildItem | Format-Table Name, Length, LastWriteTime
            exit 1
          }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fsr3-windows-integration
          path: |
            native/fsr3_wine_bridge/build_windows/fsr3_windows.dll
            native/fsr3_wine_bridge/fsr3_windows.h
            native/fsr3_wine_bridge/ffx_api.h
          retention-days: 7

      - name: Create build summary
        if: success()
        shell: pwsh
        run: |
          echo "## FSR3 Windows Build Summary" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "✅ Build completed successfully" >> $env:GITHUB_STEP_SUMMARY
          echo "" >> $env:GITHUB_STEP_SUMMARY
          echo "### Artifacts:" >> $env:GITHUB_STEP_SUMMARY
          echo "- fsr3_windows.dll (Windows FSR3 integration)" >> $env:GITHUB_STEP_SUMMARY
          echo "- fsr3_windows.h (C API header)" >> $env:GITHUB_STEP_SUMMARY
          echo "- ffx_api.h (FFX API definitions)" >> $env:GITHUB_STEP_SUMMARY

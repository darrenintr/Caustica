name: Build NRD natives

on:
  push:
    paths:
      - ".github/workflows/build-nrd.yml"
      - "native/nrd/**"
      - "scripts/build_nrd_*"
      - "scripts/nrd-version.env"
  pull_request:
    paths:
      - ".github/workflows/build-nrd.yml"
      - "native/nrd/**"
      - "scripts/build_nrd_*"
      - "scripts/nrd-version.env"
  workflow_dispatch:

env:
  VULKAN_SDK_VERSION: 1.4.350.0
  VULKAN_SDK_SHA256: b65f068ab36263559da49d7cacd7e7b9df23824ca8b68ccc522a2b06f5725df2

jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: ${{ env.VULKAN_SDK_VERSION }}
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true
      - name: Compile pinned NRD and nrd_caustica.dll
        shell: pwsh
        run: ./scripts/build_nrd_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: nrd-windows-x64
          path: src/main/resources/caustica/natives/windows-x64/nrd_caustica.dll
          if-no-files-found: error

  linux-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build glslang-tools spirv-tools libvulkan-dev
      - name: Compile pinned NRD and libnrd_caustica.so
        run: bash ./scripts/build_nrd_linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nrd-linux-x64
          path: src/main/resources/caustica/natives/linux-x64/libnrd_caustica.so
          if-no-files-found: error

  package:
    runs-on: ubuntu-latest
    needs: [windows-x64, linux-x64]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install pinned Vulkan shader tools
        run: |
          archive="vulkansdk-linux-x86_64-${VULKAN_SDK_VERSION}.tar.xz"
          url="https://sdk.lunarg.com/sdk/download/${VULKAN_SDK_VERSION}/linux/${archive}"
          sdk_root="${RUNNER_TEMP}/vulkan-sdk/${VULKAN_SDK_VERSION}/x86_64"
          curl --fail --location --retry 3 --output "${archive}" "${url}"
          echo "${VULKAN_SDK_SHA256}  ${archive}" | sha256sum --check
          mkdir -p "${RUNNER_TEMP}/vulkan-sdk"
          tar -xf "${archive}" -C "${RUNNER_TEMP}/vulkan-sdk"
          echo "${sdk_root}/bin" >> "${GITHUB_PATH}"
          "${sdk_root}/bin/glslangValidator" --version
      - uses: actions/download-artifact@v4
        with:
          name: nrd-windows-x64
          path: src/main/resources/caustica/natives/windows-x64
      - uses: actions/download-artifact@v4
        with:
          name: nrd-linux-x64
          path: src/main/resources/caustica/natives/linux-x64
      - name: Build jar with freshly compiled NRD natives
        run: bash ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: caustica-nrd-bundled-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-dev.jar
          if-no-files-found: error

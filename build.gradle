import javax.inject.Inject
import org.gradle.process.ExecOperations

plugins {
	id "fabric-loom" version "${loom_version}"
	id "maven-publish"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = "Fabric"
		url = "https://maven.fabricmc.net/"
	}
	mavenCentral()
}

loom {
	runs {
		client {
			client()
			setConfigName("Fabric Client")
			ideConfigGenerated = true
			runDir = "run"
			// java.lang.foreign restricted methods (FFM bindings to amd_fidelityfx_vk.dll)
			vmArg "--enable-native-access=ALL-UNNAMED"

            // NixOS fix: Gradle forks drop the dev-shell's LD_LIBRARY_PATH. Keep the system Vulkan
            // driver directory visible to native Vulkan providers launched by runClient.
            if (file("/run/opengl-driver/lib").exists()) {
                def inherited = System.getenv("LD_LIBRARY_PATH")
                environmentVariable "LD_LIBRARY_PATH",
                        inherited ? "/run/opengl-driver/lib:${inherited}" : "/run/opengl-driver/lib"
            }
		}

		server {
			server()
			setConfigName("Fabric Server")
			ideConfigGenerated = true
			runDir = "run"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Layered TOML config (config/caustica.toml) — NightConfig, the same library NeoForge's
	// ModConfigSpec is built on.
	include implementation("com.electronwill.night-config:core:3.8.3")
	include implementation("com.electronwill.night-config:toml:3.8.3")
}

processResources {
	inputs.property "version", project.version
	// Local native backups and manually compiled legacy SPIR-V may live under resources while
	// diagnosing a driver issue. They are not runtime inputs and must never leak into release jars.
	exclude "caustica/natives/**/*.bak-*"
	exclude "caustica/rt/denoise/svgf_*.comp.spv"

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

// Compile the GLSL shaders (shaders/**) to SPIR-V at build time instead of tracking the .spv.
// The .spv are pure build output of the GLSL; generating them here makes stale binaries impossible
// and gives incremental up-to-date checks. Requires the Vulkan SDK's glslangValidator (+ spirv-val);
// located via the VULKAN_SDK env var (set by the SDK installer) with a PATH fallback.
def shaderGenRoot = layout.buildDirectory.dir("generated/shaders") // classpath root -> /caustica/rt/*.spv

def resolveVulkanTool = { String name ->
	def exe = org.gradle.internal.os.OperatingSystem.current().windows ? ".exe" : ""
	def sdk = System.getenv("VULKAN_SDK")
	if (sdk) {
		def fromSdk = file("${sdk}/Bin/${name}${exe}")
		if (fromSdk.exists()) {
			return fromSdk.absolutePath
		}
	}
	return "${name}${exe}" // fall back to PATH; exec fails with a clear message if absent
}

abstract class CompileShaders extends DefaultTask {
	@InputDirectory abstract DirectoryProperty getSrcDir()
	@OutputDirectory abstract DirectoryProperty getOutDir()
	@Input abstract Property<String> getGlslang()
	@Input abstract Property<String> getSpirvVal()

	@Inject abstract ExecOperations getExecOps()

	@TaskAction
	void compile() {
		def outDirFile = outDir.get().asFile
		outDirFile.mkdirs()
		outDirFile.listFiles().findAll { it.isFile() && it.name.endsWith(".spv") }.each { it.delete() }
		def stageIncludes = ["**/*.rgen", "**/*.rchit", "**/*.rahit", "**/*.rmiss", "**/*.rcall",
				"**/*.comp", "**/*.vert", "**/*.frag"]
		def compileOne = { File src, File spv, List<String> defines ->
			execOps.exec {
				// -g (OpLine/OpSource debug info), not -gVS: the NonSemantic.Shader.DebugInfo form (-gVS)
				// emits OpExtInstWithForwardRefsKHR (SPV_KHR_relaxed_extended_instruction), which trips a
				// validation error unless the shaderRelaxedExtendedInstruction device feature is enabled.
				// -g keeps source-level debug info for Nsight/RenderDoc without needing that extension.
				// Vulkan 1.2 is Blaze3D's device baseline and already includes SPIR-V 1.4,
				// buffer-device-address, descriptor indexing, and shader float controls. Keeping the
				// shader environment at 1.2 avoids excluding otherwise capable KHR RT drivers.
				commandLine([glslang.get(), "-V", "--target-env", "vulkan1.2", "-g"] + defines
						+ [src.absolutePath, "-o", spv.absolutePath])
			}
			execOps.exec {
				commandLine spirvVal.get(), "--target-env", "vulkan1.2", spv.absolutePath
			}
		}
		def shaderFiles = srcDir.get().asFileTree.matching {
			include stageIncludes
		}.files.sort { it.absolutePath }
		def duplicateOutputs = shaderFiles
				.groupBy { "${it.name}.spv" }
				.findAll { entry -> entry.value.size() > 1 }
		if (!duplicateOutputs.isEmpty()) {
			throw new GradleException("Duplicate shader output name(s): "
					+ duplicateOutputs.collect { entry -> "${entry.key} from ${entry.value*.path.join(', ')}" }.join("; "))
		}
		shaderFiles.each { src ->
			def spv = new File(outDirFile, "${src.name}.spv")
			compileOne(src, spv, [])
			if (src.name == "world.rgen") {
				compileOne(src, new File(outDirFile, "world_noser.rgen.spv"), ["-DCAUSTICA_SER_NONE=1"])
			} else if (src.name == "world.rchit") {
				compileOne(src, new File(outDirFile, "world_noposfetch.rchit.spv"),
						["-DCAUSTICA_POSITION_FETCH_NONE=1"])
			} else if (src.name == "block_outline.frag") {
				compileOne(src, new File(outDirFile, "block_outline_no_ray_query.frag.spv"),
						["-DCAUSTICA_RAY_QUERY_NONE=1"])
			}
		}
	}
}

def compileShaders = tasks.register("compileShaders", CompileShaders) {
	group = "build"
	description = "Compiles shaders/** shader sources to SPIR-V and validates them."
	srcDir = file("shaders")
	outDir = layout.buildDirectory.dir("generated/shaders/caustica/rt")
	glslang = resolveVulkanTool("glslangValidator")
	spirvVal = resolveVulkanTool("spirv-val")
}

// Emit the .spv into the main resources so they land in the jar / on the runClient classpath at the
// same /caustica/rt/ path the loader (RtPipeline/RtBlendPipeline) reads. builtBy wires the dependency.
sourceSets.main.resources.srcDir(files(shaderGenRoot).builtBy(compileShaders))

// Legacy SDK bundle tasks were removed with their old provider implementations. Optional
// upscalers and frame generators now own capability probing and native loading behind their
// provider interfaces; the build does not route runtime behavior by GPU vendor.

// libcaustica_native JNI scaffold (Phase 1, 2026-07-20). The native half is a single
// `ping()` round-trip to prove cmake → ninja → jar → System.load → JNI call works
// end-to-end; the C++ source intentionally does not touch any AMD FFX / NRD / Vulkan
// SDK (header files aren't present on the build host yet).
//
// This task is OPTIONAL: if cmake / ninja are missing, or the configure / build
// subprocess returns non-zero, the task logs a warning and produces no output. The jar
// task always succeeds (the resources srcDir is empty in that case), and the Java
// NativeBridge falls back to the existing GLSL path when the .so is absent.
def buildNativeOutDir = layout.buildDirectory.dir("generated/native")
def buildNative = tasks.register("buildNative") {
	group = "build"
	description = "Builds the libcaustica_native JNI scaffold via cmake+ninja and copies it into resources/caustica/natives/<platform>/. Skips with a warning if the toolchain is unavailable — never fails the main build."

	inputs.dir file("native/src")
	inputs.file file("native/CMakeLists.txt")
	outputs.dir buildNativeOutDir

	doLast {
		try {
			// Resolve the toolchain. cmake/ninja must be on PATH; JAVA_HOME / java.home
			// must point at a JDK with jni.h + jni_md.h.
			def javaHome = System.getProperty("java.home") ?: System.getenv("JAVA_HOME")
			if (javaHome == null || javaHome.isEmpty()) {
				logger.warn("buildNative: JAVA_HOME not set; skipping native build")
				return
			}

			def cmake = ["cmake", "cmake3"].find { isExeOnPath(it) }
			if (cmake == null) {
				logger.warn("buildNative: cmake not on PATH; skipping native build")
				return
			}
			def ninja = ["ninja", "ninja-build"].find { isExeOnPath(it) }
			if (ninja == null) {
				logger.warn("buildNative: ninja not on PATH; skipping native build")
				return
			}

			// Platform routing for the portable JNI resource layout.
			def os = org.gradle.internal.os.OperatingSystem.current()
			def arch = System.getProperty("os.arch", "").toLowerCase()
			boolean x64 = arch == "x86_64" || arch == "amd64"
			boolean aarch64 = arch == "aarch64" || arch == "arm64"
			String platformDir
			if (os.linux && x64) {
				platformDir = "linux-x64"
			} else if (os.linux && aarch64) {
				platformDir = "linux-arm64"
			} else if (os.windows && x64) {
				platformDir = "windows-x64"
			} else if (os.windows && aarch64) {
				platformDir = "windows-arm64"
			} else if (os.macOs && aarch64) {
				platformDir = "macos-arm64"
			} else if (os.macOs && x64) {
				platformDir = "macos-x64"
			} else {
				logger.warn("buildNative: unsupported platform ${os}/${arch}; skipping")
				return
			}

			// Configure + build. We do a clean configure every run so changing
			// the platform or the cmake list isn't a cache-invalidation puzzle.
			// NB: ProcessBuilder must receive String[]. A bare Groovy list literal is
			// `List<Object>` (because `cmake` is a `def`); passing it to the typed-String
			// constructor triggers `ArrayStoreException: element type mismatch` on JDK 25.
			// `command(String...)` does the right conversion.
			def buildDir = layout.buildDirectory.dir("native/build").get().asFile
			if (buildDir.exists()) {
				delete(buildDir)
			}
			def configureProc = new ProcessBuilder()
					.command(cmake, "-S", "native", "-B", buildDir.absolutePath,
							"-G", "Ninja", "-DJAVA_HOME=${javaHome}",
							"-DCMAKE_BUILD_TYPE=Release")
					.redirectErrorStream(true)
					.start()
			def configureOut = configureProc.inputStream.text
			configureProc.waitFor()
			if (configureProc.exitValue() != 0) {
				logger.warn("buildNative: cmake configure failed (exit {}); skipping\n{}", configureProc.exitValue(), configureOut)
				return
			}

			def buildProc = new ProcessBuilder()
					.command(ninja, "-C", buildDir.absolutePath)
					.redirectErrorStream(true)
					.start()
			def buildOut = buildProc.inputStream.text
			buildProc.waitFor()
			if (buildProc.exitValue() != 0) {
				logger.warn("buildNative: ninja build failed (exit {}); skipping\n{}", buildProc.exitValue(), buildOut)
				return
			}

			// Copy the .so into the resources tree that NativeBridge will extract
			// from at runtime. The runtime expects /caustica/natives/<platform>/lib*.so.
			def sharedLib = new File(buildDir, "libcaustica_native" + (os.windows ? ".dll" : ".so"))
			if (!sharedLib.exists()) {
				logger.warn("buildNative: expected ${sharedLib} not found; skipping")
				return
			}
			def targetDir = new File(buildNativeOutDir.get().asFile, "caustica/natives/${platformDir}")
			targetDir.mkdirs()
			def target = new File(targetDir, sharedLib.name)
			java.nio.file.Files.copy(sharedLib.toPath(), target.toPath(),
					java.nio.file.StandardCopyOption.REPLACE_EXISTING)
			logger.lifecycle("buildNative: built ${target} (${sharedLib.length()} bytes)")
		} catch (Throwable t) {
			// Never fail the main build — the user constraint is "no failure".
			logger.warn("buildNative: unexpected failure; continuing without native", t)
		}
	}
}

sourceSets.main.resources.srcDir(files(buildNativeOutDir).builtBy(buildNative))

// Local helper: is `name` an executable on PATH?
def isExeOnPath(String name) {
	def path = System.getenv("PATH")
	if (path == null) {
		return false
	}
	for (String dir : path.split(File.pathSeparator)) {
		if (dir == null || dir.isEmpty()) continue
		def exe = new File(dir, name)
		if (exe.isFile() && exe.canExecute()) {
			return true
		}
	}
	return false
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
	withSourcesJar()
}

tasks.named("jar", Jar).configure {
	from(rootProject.files("LICENSE.md", "COPYING", "COPYING.LESSER", "THIRD_PARTY_NOTICES.md")) {
		into "META-INF"
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}
}
